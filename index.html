<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f33">
<meta name="description" content="Countdown to 13 November, 22:00 London time.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="London">
<title>London · 13 November</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/sky-layers.css">
<link rel="stylesheet" href="styles/meeting.css">
<link rel="stylesheet" href="styles/info-card.css">
<link rel="stylesheet" href="styles/install-prompt.css">
<script type="importmap">{ "imports": { "@/": "./src/" } }</script>
<link rel="modulepreload" href="src/backgrounds/index.js">
<link rel="modulepreload" href="src/backgrounds/aurora-tropics.js">
<link rel="modulepreload" href="src/backgrounds/converging.js">
<link rel="modulepreload" href="src/backgrounds/meeting-city.js">
<link rel="modulepreload" href="src/backgrounds/origin-weather.js">
<link rel="modulepreload" href="src/gateways/weather-gateway.js">
<link rel="modulepreload" href="src/services/cached-json.js">
<link rel="modulepreload" href="src/services/config.js">
<link rel="modulepreload" href="src/services/connection.js">
<link rel="modulepreload" href="src/services/i18n.js">
<link rel="modulepreload" href="src/ui/characters.js">
<link rel="modulepreload" href="src/ui/countdown.js">
<link rel="modulepreload" href="src/ui/headline.js">
<link rel="modulepreload" href="src/ui/info-card.js">
<link rel="modulepreload" href="src/ui/install-prompt.js">
<link rel="modulepreload" href="src/ui/meeting.js">
<link rel="modulepreload" href="src/ui/origin-pins.js">
<link rel="modulepreload" href="src/utils/enums.js">
<link rel="modulepreload" href="src/utils/meeting-time.js">
<link rel="modulepreload" href="src/utils/stylesheet.js">
<link rel="modulepreload" href="src/utils/thresholds.js">
<script type="module" src="src/main.js"></script>
</head>
<body>

<div class="splash" id="splash" role="status" aria-label="Loading countdown">
  <div class="splash__glow"></div>
  <svg class="splash__mark" viewBox="0 0 120 150" aria-hidden="true">
    <path d="M60 8 C 28 8, 4 32, 4 64 C 4 100, 40 136, 60 148 C 80 136, 116 100, 116 64 C 116 32, 92 8, 60 8 Z" fill="currentColor"/>
    <circle cx="60" cy="62" r="34" fill="#0b1f33"/>
    <circle cx="60" cy="62" r="26" fill="none" stroke="#f3f7ff" stroke-width="2.5"/>
    <path d="M60 44v20l14 9" fill="none" stroke="#f3f7ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="62" r="3.5" fill="#f3f7ff"/>
  </svg>
</div>

<div class="sky" id="sky" aria-hidden="true"></div>

<svg class="route" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <path class="route__line route__line--north" d="M 10 3 C 18 20, 28 32, 50 57" vector-effect="non-scaling-stroke"/>
  <path class="route__line route__line--south" d="M 92 99 C 80 86, 74 74, 50 61" vector-effect="non-scaling-stroke"/>
</svg>

<nav class="pins">
  <button class="pin pin--north" type="button" data-origin="north" aria-haspopup="dialog"><i></i><span class="pin__label"></span></button>
  <button class="pin pin--south" type="button" data-origin="south" aria-haspopup="dialog"><i></i><span class="pin__label"></span></button>
</nav>

<div class="topbar">
  <span class="offline-mark" id="offlineMark" role="status" data-i18n-aria="ui.offline" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <g fill="currentColor">
        <circle cx="8.8" cy="13" r="3.4"/>
        <circle cx="13.4" cy="11" r="4.3"/>
        <circle cx="17" cy="13.6" r="3"/>
        <rect x="5.4" y="12.8" width="12.6" height="4.4" rx="2.2"/>
      </g>
      <path d="M3.6 3.6 20.4 20.4" stroke="rgba(8, 18, 32, .85)" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M3.6 3.6 20.4 20.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    </svg>
  </span>
  <button class="lang" id="languageButton" type="button" data-i18n-aria="ui.language">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M3.5 12h17M12 3.5c2.4 2.3 2.4 14.2 0 17M12 3.5c-2.4 2.3-2.4 14.2 0 17" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </svg>
    <span id="languageCode">EN</span>
  </button>
</div>

<main class="stage">

  <header class="headline">
    <p class="headline__kicker" id="kicker"></p>
    <h1 class="headline__city" id="city"></h1>
    <p class="headline__when"><span id="meetingDate"></span> · <strong id="meetingTime"></strong> <span id="meetingZone"></span></p>
  </header>

  <section class="countdown" id="countdown" aria-live="polite" data-i18n-aria="ui.countdownLabel">
    <div class="unit"><span class="unit__value" id="days"></span><span class="unit__label" data-i18n="ui.days"></span></div>
    <div class="unit"><span class="unit__value" id="hours"></span><span class="unit__label" data-i18n="ui.hours"></span></div>
    <div class="unit"><span class="unit__value" id="minutes"></span><span class="unit__label" data-i18n="ui.minutes"></span></div>
    <div class="unit"><span class="unit__value" id="seconds"></span><span class="unit__label" data-i18n="ui.seconds"></span></div>
  </section>

  <p class="reunion" id="reunion" data-i18n="ui.reunion" hidden></p>

  <div class="meeting" id="meeting">
    <span class="heart" aria-hidden="true">♥</span>
  </div>

</main>

<dialog class="info-card" id="infoCard" aria-labelledby="infoCardName">
  <div class="info-card__sheet">
    <form method="dialog">
      <button class="info-card__close" type="submit" data-i18n-aria="ui.close">×</button>
    </form>
    <p class="info-card__origin" id="infoCardOrigin"></p>
    <h2 class="info-card__name" id="infoCardName"></h2>
    <p class="info-card__scientific" id="infoCardScientificName"></p>
    <ul class="info-card__facts" id="infoCardFacts"></ul>
  </div>
</dialog>

<aside class="install-prompt" id="installPrompt" hidden>
  <p class="install-prompt__text" id="installInvite" data-i18n="ui.installInvite"></p>
  <p class="install-prompt__text" id="installIosHint" data-i18n="ui.installIos"></p>
  <button class="install-prompt__action" id="installAction" type="button" data-i18n="ui.installAction"></button>
  <button class="install-prompt__close" id="installClose" type="button" data-i18n-aria="ui.close">×</button>
</aside>

</body>
</html>
